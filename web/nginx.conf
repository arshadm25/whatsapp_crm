server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Meta's SDK and popup need connect.facebook.net and facebook.com.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://connect.facebook.net https://checkout.razorpay.com; frame-src https://www.facebook.com https://web.facebook.com https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' https://*.facebook.com https://*.facebook.net https://*.razorpay.com; img-src 'self' data: https://*.facebook.com https://*.fbcdn.net https://*.razorpay.com; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /healthz {
        access_log off;
        return 204;
    }
    # Single-page app: every other path serves index.html, never cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
