name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - run: go vet ./...
      - name: sqlc generated code is up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code internal/db/dbq
      - name: Tests (including database and tenant-isolation tests)
        env:
          ECOGO_TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: go test -count=1 ./...

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/ecogo-whatsapp
      - run: helm template ci deploy/helm/ecogo-whatsapp > /dev/null
      # Numeric IDs reach Helm as floats (values files, --reuse-values) and must still render
      # as written, not as 8.8789121708352e+14.
      - run: |
          echo 'config: {metaAppId: 887891217083520}' > /tmp/ids.yaml
          helm template ci deploy/helm/ecogo-whatsapp -f /tmp/ids.yaml \
            | grep -A1 ECOGO_META_APP_ID | grep -q '"887891217083520"'

  # Images are pushed to GitHub Container Registry on main only.
  images:
    needs: [backend, dashboard, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}-web:${{ github.sha }}

  # Every green build of main moves the production branch to its commit. Argo CD in the cluster
  # deploys whatever production points at (deploy/argocd), so nothing here holds cluster
  # credentials. Rollbacks and redeploys use the Deploy workflow.
  release:
    if: github.event_name == 'push'
    needs: [images]
    runs-on: ubuntu-latest
    concurrency: { group: production, cancel-in-progress: false }
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move production to this commit
        id: move
        run: |
          # Only move forward: a slower run for an older commit must not undo a newer deploy.
          if git fetch -q origin production && ! git merge-base --is-ancestor FETCH_HEAD "$GITHUB_SHA"; then
            echo "production is at $(git rev-parse FETCH_HEAD), which is not behind $GITHUB_SHA; leaving it." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/heads/production"
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "production -> $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wait until production serves this commit
        if: steps.move.outputs.moved == 'true' && vars.PRODUCTION_URL != ''
        run: deploy/argocd/wait-for-version.sh "${{ vars.PRODUCTION_URL }}" "$GITHUB_SHA"
