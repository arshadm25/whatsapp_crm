{{- if .Values.migrations.enabled }}
# Runs after the first install (so a CloudNativePG cluster from this chart exists) and before
# every upgrade, so new code never starts against an old schema. Under Argo CD it is a PreSync
# hook: if it fails, the sync stops and the running pods keep the old version.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "ecogo.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "ecogo.selector" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "ecogo.image" . }}
          args: ["migrate"]
          env:
            - name: ECOGO_MIGRATION_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: migration-database-url } }
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
