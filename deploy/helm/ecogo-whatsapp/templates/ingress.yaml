{{- if .Values.ingress.enabled }}
{{- $tls := .Values.ingress.tls.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "ecogo.labels" . | nindent 4 }}
  annotations:
    {{- if $tls }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls }}
  tls:
    - secretName: {{ .Release.Name }}-tls
      hosts:
        - {{ .Values.hosts.app }}
        - {{ .Values.hosts.api }}
        - {{ .Values.hosts.hooks }}
    {{- with .Values.hosts.legacy }}
    - secretName: {{ $.Release.Name }}-legacy-tls
      hosts:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.hosts.app }}
      http:
        paths:
          - { path: /internal, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { name: http } } } }
          - { path: /v1, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { name: http } } } }
          - { path: /webhooks, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-web, port: { name: http } } } }
    - host: {{ .Values.hosts.api }}
      http:
        paths:
          - { path: /v1, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { name: http } } } }
    - host: {{ .Values.hosts.hooks }}
      http:
        paths:
          - { path: /meta, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-ingest, port: { name: http } } } }
    {{- /* Legacy hosts route every path the three hosts above serve, whichever one they were. */}}
    {{- range .Values.hosts.legacy }}
    - host: {{ . }}
      http:
        paths:
          - { path: /internal, pathType: Prefix, backend: { service: { name: {{ $.Release.Name }}-api, port: { name: http } } } }
          - { path: /v1, pathType: Prefix, backend: { service: { name: {{ $.Release.Name }}-api, port: { name: http } } } }
          - { path: /webhooks, pathType: Prefix, backend: { service: { name: {{ $.Release.Name }}-api, port: { name: http } } } }
          - { path: /meta, pathType: Prefix, backend: { service: { name: {{ $.Release.Name }}-ingest, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: {{ $.Release.Name }}-web, port: { name: http } } } }
    {{- end }}
{{- end }}
