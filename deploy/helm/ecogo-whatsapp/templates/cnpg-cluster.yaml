{{- if .Values.postgres.cnpg.enabled }}
{{- $pg := .Values.postgres.cnpg }}
{{- /* --reuse-values keeps no entry for a key added later, so fall back to the default here. */}}
{{- $method := $pg.backup.method | default "plugin" }}
# PostgreSQL 16 via the CloudNativePG operator: a primary and a streaming replica with
# automatic failover. ecogo_owner owns the schema (BYPASSRLS for the lookup functions);
# ecogo_app is what the services use and is subject to row-level security.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-pg
  labels:
    {{- include "ecogo.labels" . | nindent 4 }}
  annotations:
    # The database outlives the release: Helm and Argo CD never delete it.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: {{ $pg.instances }}
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: {{ $pg.storageSize }}
    {{- with $pg.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  bootstrap:
    initdb:
      database: ecogo
      owner: ecogo_owner
      secret:
        name: {{ $pg.ownerSecret }}
  managed:
    roles:
      - name: ecogo_owner
        ensure: present
        login: true
        bypassrls: true
        passwordSecret:
          name: {{ $pg.ownerSecret }}
      - name: ecogo_app
        ensure: present
        login: true
        bypassrls: false
        passwordSecret:
          name: {{ $pg.appSecret }}
  {{- if and $pg.backup.enabled (eq $method "plugin") }}
  # Backups and WAL archiving go through the Barman Cloud plugin (operator namespace cnpg-system).
  # The old in-tree barmanObjectStore is deprecated and removed in CloudNativePG 1.31.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Release.Name }}-pg-backup
  {{- else if $pg.backup.enabled }}
  backup:
    retentionPolicy: {{ $pg.backup.retentionPolicy }}
    barmanObjectStore:
      destinationPath: {{ $pg.backup.destinationPath }}
      endpointURL: {{ $pg.backup.endpointURL }}
      s3Credentials:
        accessKeyId: { name: {{ $pg.backup.credentialsSecret }}, key: ACCESS_KEY_ID }
        secretAccessKey: { name: {{ $pg.backup.credentialsSecret }}, key: ACCESS_SECRET_KEY }
      wal:
        compression: gzip
        {{- with $pg.backup.encryption }}
        encryption: {{ . }}
        {{- end }}
      {{- with $pg.backup.encryption }}
      data:
        encryption: {{ . }}
      {{- end }}
  {{- end }}
{{- if $pg.backup.enabled }}
{{- if eq $method "plugin" }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ .Release.Name }}-pg-backup
  labels:
    {{- include "ecogo.labels" . | nindent 4 }}
spec:
  retentionPolicy: {{ $pg.backup.retentionPolicy | quote }}
  configuration:
    destinationPath: {{ $pg.backup.destinationPath }}
    endpointURL: {{ $pg.backup.endpointURL }}
    s3Credentials:
      accessKeyId: { name: {{ $pg.backup.credentialsSecret }}, key: ACCESS_KEY_ID }
      secretAccessKey: { name: {{ $pg.backup.credentialsSecret }}, key: ACCESS_SECRET_KEY }
    wal:
      compression: gzip
      {{- with $pg.backup.encryption }}
      encryption: {{ . }}
      {{- end }}
    {{- with $pg.backup.encryption }}
    data:
      encryption: {{ . }}
    {{- end }}
{{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Release.Name }}-pg-nightly
spec:
  schedule: "0 0 2 * * *"
  {{- if eq $method "plugin" }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  {{- end }}
  cluster:
    name: {{ .Release.Name }}-pg
{{- end }}
{{- end }}
